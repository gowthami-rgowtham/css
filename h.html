<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
nav{display:flex; justify-content:space-between; align-items:center; padding:10px; background:#eee;}
.nav-links{display:flex; gap:20px; list-style:none;}
.banner img{width:100%;}
.bank-offers{display:flex; gap:10px; margin-top:15px;}
.bank-offers div{width:33%; padding:20px; background:lightyellow; border:1px solid #ccc; text-align:center;}
.best-sellers{display:flex; gap:10px; margin-top:15px;}
.best-sellers div{width:18%; padding:30px 10px; background:#f5f5f5; text-align:center;}

@media(max-width:700px){
  nav{flex-direction:column;}
  .nav-links{flex-direction:column; align-items:center;}
  .bank-offers{flex-direction:column;}
  .bank-offers div{width:100%;}
  .best-sellers{flex-direction:column; align-items:center;}
  .best-sellers div{width:80%;}
}
</style>
</head>
<body>

<nav>
  <b>My Logo</b>
  <ul class="nav-links"><li>Home</li><li>About</li><li>Services</li><li>Contact</li></ul>
</nav>

<div class="banner">
  <img src="banner.jpg">
</div>

<div class="bank-offers"><div>Bank Offer 1</div><div>Bank Offer 2</div><div>Bank Offer 3</div></div>

<div class="best-sellers"><div>Mango</div><div>Banana</div><div>Apple</div><div>Grapes</div><div>Orange</div></div>

</body>
</html>
