  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-sm bg-dark navbar-dark">
  <div class="container-fluid">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" href="#">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">AboutUs</a>

      <li class="nav-item">
        <a class="nav-link" href="#">Contact</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Register</a>
      </li>
    </ul>
  </div>
</nav>
<center><h1>register</h1></center>
<div class="container">
  <form>
    <div class="mb-3 mt-3">
      <label for="username" class="form-label">username:</label>
      <input type="text" class="form-control" id="username" placeholder="Enter username" name="username">
    </div>
    <div class="mb-3">
      <label for="pwd" class="form-label">password:</label>
      <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
    </div>
    <div class="mb-3">
      <label for="cpwd" class="form-label">confirm password:</label>
      <input type="password" class="form-control" id="cpwd" placeholder="Confirm password" name="cpswd">
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email:</label>
      <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
    </div>
    <div class="mb-3">
      <label for="phone" class="form-label">phone:</label>
      <input type="tel" class="form-control" id="phone" placeholder="Enter phone" name="phone">
    </div>
    <div class="mb-3">
      <label for="address" class="form-label">Address:</label>
      <input type="text" class="form-control" id="address" placeholder="Enter address" name="address">
    </div>
    <div class="mb-3">
      <label class="form-label">Gender:</label><br>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" id="male" value="male">
        <label class="form-check-label" for="male">male</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" id="female" value="female">
        <label class="form-check-label" for="female">female</label>
      </div>
    </div>
    <div class="mb-3">
      <label for="country" class="form-label">country:</label>
      <select class="form-select" id="country" name="country">
        <option>USA</option>
        <option>India</option>
        <option>UK</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">hobbies:</label><br>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="reading" value="Reading">
        <label class="form-check-label" for="reading">Reading</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="traveling" value="Traveling">
        <label class="form-check-label" for="traveling">Traveling</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="sports" value="Sports">
        <label class="form-check-label" for="sports">Sports</label>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">register</button>
  </form>
</div>

</body>
</html>
