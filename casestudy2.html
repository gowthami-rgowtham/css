<html>
<head>
    <title>College Event</title>
</head>

<body>

    <h1>College Event</h1>

    <h2>Home</h2>
    <p>Welcome to our College Annual Event.</p>

    <h2>Events</h2>
    <ul>
        <li>Web Designing</li>
        <li>Coding Competition</li>
        <li>Paper Presentation</li>
    </ul>

    <h2>Schedule</h2>

    <table border="1">

        <tr>
            <th>Event</th>
            <th>Time</th>
        </tr>

        <tr>
            <td>Web Designing</td>
            <td>10:00 AM</td>
        </tr>

        <tr>
            <td>Quiz</td>
            <td>11:00 AM</td>
        </tr>

        <tr>
            <td>Coding</td>
            <td>2:00 PM</td>
        </tr>

    </table>

    <h2>Registration</h2>

    <table>

        <tr>
            <td><label>Name</label></td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td><label>Email</label></td>
            <td><input type="email"></td>
        </tr>

        <tr>
            <td><label>Select Event</label></td>
            <td>
                <select>
                    <option>Web Designing</option>
                    <option>Quiz</option>
                    <option>Coding</option>
                </select>
            </td>
        </tr>

        <tr>
            <td></td>
            <td><input type="submit" value="Register"></td>
        </tr>

    </table>

</body>
</html>
