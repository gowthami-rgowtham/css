<html>
    <head>
        <title>Text Align</title>
    <style>
        h1{
            text-align: center;
        }
        .left{
            text-align: left;
        }
        .right{
            text-align: right;
        }
        .justify{
            text-align: justify;
        }
    </style>
    </head>
    <body>
        <h1>Text Alignment</h1>
        <h2>Left Alignment</h2>
        <p class="left">This is aligned to the left.</p>
        <h2>Right Alignment</h2>
        <p class="Right">This is aligned to the right.</p>
        <h2>justify Alignment</h2>
        <p class="justify">This paragraph is aligned using justify.The text is adjusted evenly between the left and right sides of the page.</p>
    </body>
</html>
