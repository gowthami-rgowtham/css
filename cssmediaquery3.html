<style>
    *
    {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body
    {
        font-family: 'Courier New', Courier, monospace;
        background-color: rgb(238, 242, 242);

    }
    nav
    {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
        background-color: rgb(175,225,245);
    }
    .logo
    {
        color: brown;
        list-style: none;
    }
    .nav-links
    {
        display: flex;
        gap: 30px;
        list-style: none;
    }
    .nav-links a
    {
        text-decoration: none;
        color: #834eec;
        font-size: medium;
        position: relative;
        transition: color 0.3s ease;
    }
    .nav-links a:hover 
    {
        color: bisque;
    }
    .nav-links a::after{
        content: "";
        position: absolute;
        left: 0px;
        bottom:-5px;
        width: 0%;
        height: 2px;
        background-color: #834eec;
        transition: width 0.3s ease-in-out;
    }
    .nav-links a:hover::after{
        width:100%
    } 
    /*flex concepts*/
    .offers
    {
        display: flex;
        gap: 20px;
        justify-content: center;
    }
    .offers img
    {
        width: 30%;
        height: auto;
    }
    @media (max-width:700px)
    {
        nav{
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
    }
    .nav-links{
        flex-direction: column;
        gap: 15px;
        align-items: center;
    }
    img.a
    {
        height: 50%;
    }
</style>
<h3>Special offers</h3>
<div class="offers">
</div>
<body>
    <nav>
        <div class="logo">My Logo</div>
        <ul class="nav-links">
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Services</a></li>
            <li><a href="">Contact</a></li>
        </ul>
    </nav>
    <img src="offer1.jpg"alt=""width="100%"height="100%"class="a">
</body>
