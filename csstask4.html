<html>
    <head>
        <title>Z-Index</title>
        <style>
            .container{
                position: relative;
                width: 400px;
                height: 300px;
            }
            .box{
                width: 150px;
                height: 150px;
                position: absolute;
            }
            .red{
                background-color: red;
                left: 50px;
                top: 30px;
                z-index: 1;
            }
            .blue{
                background-color: blue;
                left: 100px;
                top: 80px;
                z-index: 2;
            }
            .green{
                background-color: green;
                left: 150px;
                top: 110px;
                z-index: 3;
            }
            .top-button{
                position: absolute;
                left: 120px;
                top: 120px;
                z-index: 10;
            }
        </style>
    </head>
    <body>
        <h2>Z-Index</h2>
        <div class="container">
            <div class="box red"></div>
            <div class="box blue"></div>
            <div class="box green"></div>
            <button class="top-button">Button Above All</button>
        </div>
    </body>
</html>
