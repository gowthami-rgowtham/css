<html>
    <head>
        <title>css border</title>
        <style>
            h1  
            {
                border-style:dashed
            }
            h2 
            {
                border-style: dotted;
            }
            h3 
            {
                border-top-style: dashed;
                border-bottom-style: double;
                border-right-style: dashed;
                border-left-style: double;
                border-color: aqua;
            }
            h4 
            {
                border-style: dashed;
                border-radius: 10px;
                border-width: 2px;
            }
        </style>
    </head>
    <body>
        <h1>Heading-1</h1>
        <h2>Heading-2</h2>
        <h3>Heading-3</h3>
        <h4>Heading-4</h4>
    </body>
</html>
