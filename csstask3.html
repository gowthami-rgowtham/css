<html>
    <head>
        <title>Text Transform</title>
        <style>
            .uppercase{
                text-transform: uppercase;
            }
            .lowercase{
                text-transform: lowercase;
            }
            .capitalize{
                text-transform: capitalize;
            }
        </style>
    </head>
    <body>
        <h2>Text Transform</h2>
        <form>
            <label class="uppercase">Name</label>
            <input type="text"><br><br>
            <label class="lowercase">City</label>
            <input type="text"><br><br>
            <label class="Capitalize">Course</label>
            <input type="text"><br><br>
        </form>
        <h3>Same text in Three Transformation</h3>
        <p class="uppercase">Welcome to css</p>
        <p class="lowercase">WELCOME TO CSS</p>
        <p class="capitalize">welcome to css</p>
    </body>
</html>
