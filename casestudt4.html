<html>
    <head>
        <title>Restaurant</title>
        <style>
            body{
                background-image: url("url.avif");
                background-size: cover;
                background-repeat: no-repeat;
                background-attachment: fixed;
            }
        </style>
    </head>
    <body>
        <h1>Restaurant</h1>
        <h2>Home</h2>
        <p>enjoy food</p>
        <h2>Menu</h2>
        <table border="1">
            <tr>
                <th>food item</th>
                <th>price</th>
            </tr>
            <tr>
                <td>pizza</td>
                <td>Rs.120</td>
            </tr>
            <tr>
                <td>burger</td>
                <td>Rs.150</td>
            </tr>
            <tr>
                <td>ice cream</td>
                <td>Rs.100</td>
            </tr>
        </table>
        <h2>About</h2>
        <p>Restaurant provide tasty food</p>
        <h2>book a table</h2>
        <table>
            <tr>
                <td><label>Name</label></td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td><label>Date</label></td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td><label>Time</label></td>
                <td><input type="time"></td>
            </tr>
            <tr>
                <td><label>Number of Guests</label></td>
                <td><input type="number"></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit"value="book now"></td>
            </tr>
        </table>
        <h2>contact</h2>
        <p>Email:restaurant@gmail.com</p>
    </body>
</html>
