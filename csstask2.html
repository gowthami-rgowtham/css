<html>
    <head>
        <title>Text Decoration</title>
        <style>
            .underline{
                text-decoration: underline;
            }
            .overline{
                text-decoration: overline;
            }
            .line{
                text-decoration: line-through;
            }
            .none{
                text-decoration: none;
            }
            nav a{
                text-decoration: none;
                margin: 15px;
            }
        </style>
    </head>
    <body>
        <h1>Text Decoration</h1>
        <h2>Different Text Decorations</h2>
        <ul>
            <li><a href=""class="underline">underline link</a></li>
            <li><a href=""class="overline">overline link</a></li>
            <li><a href=""class="line">line-through link</a></li>
            <li><a href=""class="none">No Decoration link</a></li>
        </ul>
        <h2>Navigation Menu</h2>
        <nav>
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Services</a>
            <a href="">Contact</a>
        </nav>
    </body>
</html>
